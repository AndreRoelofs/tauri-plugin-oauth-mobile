[package]
name = "tauri-plugin-appauth"
version = "0.2.0"
description = "Tauri 2 mobile plugin that bridges OAuth 2.0 / OIDC flows to AppAuth-iOS and AppAuth-Android."
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"
publish = true
links = "tauri-plugin-appauth"
repository = "https://github.com/eurora-labs/tauri-plugin-appauth"
keywords = ["tauri", "plugin", "oauth", "oidc", "appauth"]
categories = ["authentication"]

[lib]
name = "tauri_plugin_appauth"
path = "src/lib.rs"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.11.1" }
thiserror = "2.0.18"
tracing = "0.1.44"

[build-dependencies]
tauri-plugin = { version = "2.5", features = ["build"] }

[dev-dependencies]
tauri = { version = "2.11.1", features = ["test"] }
