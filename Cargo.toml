[package]
name = "tauri-plugin-oauth-session"
version = "0.1.0"
description = "Tauri plugin that drives OAuth flows through ASWebAuthenticationSession on iOS and Chrome Custom Tabs on Android."
edition.workspace = true
license = "LicenseRef-Eurora-SUL-AND-Apache-2.0"
publish = false
links = "tauri-plugin-oauth-session"

[lib]
name = "tauri_plugin_oauth_session"
path = "src/lib.rs"

[dependencies]
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }
tauri = { version = "2.10.2" }
thiserror = { workspace = true }
tracing = { workspace = true }

[build-dependencies]
tauri-plugin = { version = "2.5", features = ["build"] }
